<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error</title>
    <style>
        :root {
            --bg: #f8f5ef;
            --card: #fffefa;
            --ink: #14202b;
            --muted: #667085;
            --border: #e8dfd4;
            --accent: #9a3412;
        }
        body {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            background: linear-gradient(180deg, #fef3c7 0%, var(--bg) 22%, #f3eee6 100%);
            color: var(--ink);
        }
        .wrap {
            max-width: 760px;
            margin: 0 auto;
            padding: 48px 20px;
        }
        .card {
            background: rgba(255, 254, 250, 0.95);
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 28px;
            box-shadow: 0 12px 30px rgba(74, 47, 21, 0.08);
        }
        .meta {
            color: var(--muted);
        }
        a {
            color: inherit;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <section class="card">
            <h1>Something went wrong</h1>
            <p>{{ message }}</p>
            <p class="meta">Status code: {{ status_code }}</p>
            <p><a href="/jobs">Back to jobs</a></p>
        </section>
    </div>
</body>
</html>
