services:
  model_builder:
    build:
      context: ../tools/model_builder
      dockerfile: Dockerfile
    command: python prepare_model.py
    environment:
      MODEL_ONNX_PATH: /models/detr-resnet-50.onnx
      MODEL_REPO_ID: facebook/detr-resnet-50
      MODEL_HF_ONNX_FILENAME: model.onnx
      MODEL_EXPORT_OPSET: 18
      MODEL_IMAGE_SIZE: 800
    profiles: ["tools"]
    restart: "no"
    volumes:
      - model_data:/models

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: object_detection
      CELERY_REDIS_HOST: redis
      CELERY_REDIS_PORT: 6379
      CELERY_REDIS_DB: 0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - uploads_data:/app/shared
      - model_data:/app/models

  celery_worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info --concurrency=2
    environment:
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: object_detection
      CELERY_REDIS_HOST: redis
      CELERY_REDIS_PORT: 6379
      CELERY_REDIS_DB: 0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - uploads_data:/app/shared
      - model_data:/app/models

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    command: uvicorn frontend_app.main:app --host 0.0.0.0 --port 8080
    ports:
      - "8080:8080"
    environment:
      BACKEND_API_URL: http://api:8000
      BACKEND_PUBLIC_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: object_detection
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d object_detection"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_prod_data:
  uploads_data:
  model_data:
